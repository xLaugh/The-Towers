# ==========================================================
#  TheTower - arenes
# ==========================================================
# Ce fichier est genere et reecrit par le plugin.
# Ne pas l'editer pendant que le serveur tourne.
#
# Le plus simple : /tt (sans argument) ouvre le menu de configuration.
#
# Ou en commandes, en jeu :
#   /tt create <nom>
#   /tt setarenalobby <nom>              (place-toi ou tu veux le lobby d'attente)
#   /tt setspawn <nom> Rouge             (place-toi a la base de l'equipe ; idem Bleu...)
#   /tt setpool <nom> Rouge              (puis clic droit sur 2 coins opposes de la piscine)
#   /tt setspawnzone <nom> Rouge         (facultatif : zone ou l'on ne construit pas)
#   /tt setchestzone <nom> Rouge         (facultatif : coffres reserves a l'equipe)
#   /tt addgenerator <nom> iron          (a ta position ; types dans config.yml)
#   /tt setteams <nom> 2                 (2 a 4 equipes)
#   /tt setplayersperteam <nom> 4
#   /tt setminplayers <nom> 2
#   /tt setmaxplayers <nom> 8
#   /tt setpoints <nom> 10               (points pour gagner)
#   /tt setduration <nom> 40             (duree max, en minutes)
#   /tt save <nom>                       (verifie et confirme l'arene)
#
# Structure generee pour chaque arene :
#
# arenes:
#   tour1:
#     nom: tour1
#     minPlayers: 2
#     maxPlayers: 8
#     teamCount: 2
#     playersPerTeam: 4
#     points: 10
#     duration: 2400
#     allowBows: true
#     lobby: { world: world, x: 0.0, y: 64.0, z: 0.0, yaw: 0.0, pitch: 0.0 }
#     teams:
#       Rouge:
#         spawn: { world: world, x: 50.0, y: 70.0, z: 0.0, yaw: 90.0, pitch: 0.0 }
#         pool: { world: world, x1: 48, y1: 90, z1: -2, x2: 52, y2: 91, z2: 2 }
#         spawnZone: { world: world, x1: 45, y1: 65, z1: -5, x2: 55, y2: 75, z2: 5 }
#         chestZone: { world: world, x1: 45, y1: 65, z1: -5, x2: 55, y2: 75, z2: 5 }
#     generators:
#       0: { type: iron, world: world, x: 0.5, y: 65.0, z: 0.5, yaw: 0.0, pitch: 0.0 }

arenes: {}
